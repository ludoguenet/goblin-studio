<!DOCTYPE html>
<!--
    Social card source (1200x630). Re-render with:
    chromium --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=5000 \
        --screenshot=images/social-card.png src/social-card.html
-->
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            background: #0c0c0d;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 56px;
        }

        .logo {
            width: 300px;
        }

        .tagline {
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <img class="logo" src="../images/logo.png" alt="">
    <div class="tagline">Agence web · Normandie</div>
</body>
</html>
