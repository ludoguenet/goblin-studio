<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
    <defs>
        <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#34343a"/>
            <stop offset=".55" stop-color="#1f1f23"/>
            <stop offset="1" stop-color="#141416"/>
        </linearGradient>
        <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0b0b0c"/>
            <stop offset="1" stop-color="#050506"/>
        </linearGradient>
        <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset=".5" stop-color="#ffffff" stop-opacity=".18"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#00ff85" stop-opacity="0"/>
            <stop offset=".5" stop-color="#00ff85"/>
            <stop offset="1" stop-color="#00ff85" stop-opacity="0"/>
        </linearGradient>
        <filter id="shadow" x="-30%" y="-50%" width="160%" height="200%">
            <feDropShadow dx="-40" dy="60" stdDeviation="40" flood-color="#000" flood-opacity=".75"/>
        </filter>
        <filter id="halo" x="-30%" y="-100%" width="160%" height="300%">
            <feGaussianBlur stdDeviation="6"/>
        </filter>
    </defs>

    <g transform="rotate(-30 600 450)">
        <g filter="url(#shadow)">
            <rect x="260" y="-60" width="1300" height="230" rx="115" fill="url(#side)"/>
            <rect x="260" y="-88" width="1300" height="230" rx="115" fill="url(#face)"/>
            <rect x="380" y="-88" width="900" height="2" fill="url(#bevel)"/>
        </g>
        <g filter="url(#shadow)">
            <rect x="420" y="250" width="1100" height="260" rx="130" fill="url(#side)"/>
            <rect x="420" y="220" width="1100" height="260" rx="130" fill="url(#face)"/>
            <rect x="520" y="219" width="760" height="6" fill="url(#glow)" filter="url(#halo)" opacity=".8"/>
            <rect x="520" y="220" width="760" height="2" fill="url(#glow)"/>
        </g>
        <g filter="url(#shadow)">
            <rect x="200" y="600" width="1400" height="240" rx="120" fill="url(#side)"/>
            <rect x="200" y="570" width="1400" height="240" rx="120" fill="url(#face)"/>
            <rect x="320" y="570" width="900" height="2" fill="url(#bevel)"/>
        </g>
    </g>
</svg>
